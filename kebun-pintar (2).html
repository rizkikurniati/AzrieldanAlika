<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kebun Pintar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Arah: kebun bermain untuk anak kelas 1-2. Latar rumput muda, kartu putih bergaris tinta tebal,
   tombol besar, satu warna per wahana. Andika dipakai untuk huruf dan angka karena dirancang untuk anak belajar membaca. */
:root{
  --meadow:#e3f5d6; --paper:#ffffff; --ink:#14352b; --muted:#476b5c; --sun:#ffc533; --line:#bfe2b0;
  --hit:#d1490f; --hit-soft:#ffe5d6;
  --huruf:#6a3fd0; --huruf-soft:#ece4fb;
  --dunia:#0f7f74; --dunia-soft:#d6f3ef;
  --good:#178a54; --good-soft:#d8f3e6; --bad:#b4400a; --bad-soft:#ffe7d6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --kid:"Andika","Baloo 2",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--meadow);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}

/* Beranda */
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px}
.brand b{font-family:var(--display);font-size:1.15rem}
.brand span{font-size:.9rem;color:var(--muted);font-weight:800}
.hero{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:6px;padding:14px 18px 14px 10px;margin-bottom:20px}
.hero .mascot{width:104px;height:104px}
.bubble{position:relative;background:var(--sun);border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px}
.bubble::before{content:"";position:absolute;left:-11px;top:26px;width:18px;height:18px;background:var(--sun);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.bubble h1{font-size:1.7rem}
.bubble p{font-weight:700;margin-top:2px}
.sec{font-size:1.2rem;margin:0 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.seg button{min-height:60px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;font-family:var(--display);font-weight:800;font-size:1.35rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--sun)}
.wlist{display:grid;gap:14px}
.world{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;width:100%;padding:12px 16px;text-align:left;transition:transform .08s,box-shadow .08s}
.world:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.world .ic{display:grid;place-items:center;width:70px;height:70px;border:2.5px solid var(--ink);border-radius:18px;font-family:var(--kid);font-weight:700;font-size:1.5rem;color:#fff}
.world.hit .ic{background:var(--hit)} .world.huruf .ic{background:var(--huruf)} .world.dunia .ic{background:var(--dunia)}
.world .mt strong{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1}
.world .mt small{display:block;color:var(--muted);font-weight:700;font-size:.9rem;margin-top:3px}
.bs{display:flex;gap:2px}
.star{width:22px;height:22px;fill:#fff;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.star.on{fill:var(--sun)}
.guide-link{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 18px;background:transparent;border:2.5px dashed var(--ink);border-radius:16px;text-align:left;font-weight:800}
.guide-link small{display:block;color:var(--muted);font-weight:700}
.note{margin-top:18px;font-size:.88rem;color:var(--muted);font-weight:700}

/* Bermain */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ghost{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;min-height:46px}
.meta{font-weight:800;font-size:.95rem}
.poin{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.poin .star{width:24px;height:24px}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dots i{flex:1;height:12px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.dots i.full{background:var(--good)} .dots i.half{background:var(--sun)} .dots i.miss{background:#f1a58b} .dots i.now{background:var(--line)}
.play{padding:16px 16px 20px;border-top:14px solid var(--c)}
.ask{display:grid;grid-template-columns:76px 1fr;gap:6px;align-items:center}
.ask .mascot{width:76px;height:76px}
.ask .bubble{background:var(--cs)}
.ask .bubble::before{background:var(--cs);top:22px}
.ask .say{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ask .say p{font-weight:800;font-size:1.25rem;line-height:1.3}
.spk{flex:none;width:46px;height:46px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center}
.spk svg{width:24px;height:24px}
.vis{margin:16px 0 4px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.eq .op{font-family:var(--display);font-weight:800;font-size:2rem}
.eqn{font-family:var(--kid);font-weight:700;font-size:2.4rem;letter-spacing:.02em}
.grp{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:260px}
.e{font-size:1.9rem;line-height:1.1}
.e.x{color:var(--bad);font-family:var(--display);font-weight:800;font-size:1.6rem;width:1.9rem;text-align:center}
.bigemo{font-size:4.2rem;line-height:1}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:2.2rem}
.seqn{font-family:var(--kid);font-weight:700;font-size:2.2rem;letter-spacing:.06em}
.vis svg{max-width:220px;width:70%;height:auto}
.cnt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:430px}
.cnt button{position:relative;width:58px;height:58px;border:2.5px dashed var(--line);border-radius:14px;background:#fff;font-size:1.9rem;line-height:1}
.cnt button.on{border:2.5px solid var(--ink);background:var(--hit-soft)}
.cnt button b{position:absolute;right:-6px;top:-8px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--ink);color:#fff;font:700 .85rem var(--kid);display:grid;place-items:center}
.small{font-size:.9rem;font-weight:800;color:var(--muted)}

.opts{display:grid;gap:12px;margin-top:16px}
.opts.num{grid-template-columns:1fr 1fr}
.opts.pic{grid-template-columns:1fr 1fr}
.opts.txt{grid-template-columns:1fr}
.opt{position:relative;display:grid;place-items:center;min-height:68px;padding:10px 12px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;font-family:var(--display);font-weight:800;font-size:1.6rem;transition:transform .08s}
.opts.txt .opt{font-family:var(--body);font-weight:800;font-size:1.25rem;min-height:62px}
.opts.pic .opt{min-height:130px}
.opt.lt{font-family:var(--kid);font-weight:700;font-size:2.3rem}
.opt:not(:disabled):active{transform:translateY(2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:.7}
.opt.dim{opacity:.5}

.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.slot{display:grid;place-items:center;width:54px;height:64px;border:2.5px dashed var(--ink);border-radius:14px;background:#fff;font-family:var(--kid);font-weight:700;font-size:1.9rem}
.slot.f{border-style:solid;background:var(--cs)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;min-height:66px}
.tile{min-width:60px;height:66px;padding:0 10px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);font-family:var(--kid);font-weight:700;font-size:2rem}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tools{display:flex;gap:10px;justify-content:center;margin-top:12px}
.tools .ghost{min-height:44px}

.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bin{display:flex;flex-direction:column;gap:6px;align-items:center;min-height:150px;padding:10px 8px;background:var(--cs);border:2.5px dashed var(--ink);border-radius:18px;text-align:center}
.bin.go{border-style:solid;box-shadow:0 0 0 3px var(--sun)}
.bin strong{font-family:var(--display);font-size:1.1rem;line-height:1.15}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:1.7rem;line-height:1.1}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.it{display:grid;justify-items:center;gap:2px;width:92px;padding:8px 4px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.it span{font-size:2.1rem;line-height:1}
.it small{font-weight:800;font-size:.8rem;line-height:1.1}
.it.sel{background:var(--sun);transform:translateY(-3px)}

.hint{margin-top:14px;padding:10px 14px;background:var(--sun);border:2.5px solid var(--ink);border-radius:16px;font-weight:800;text-align:center}
.fb{margin-top:18px;padding:16px;border:2.5px solid var(--ink);border-radius:20px}
.fb.ok{background:var(--good-soft)} .fb.miss{background:var(--bad-soft)}
.fb h3{font-size:1.5rem}
.fb .ans{margin-top:4px;font-weight:800}
.why{margin-top:10px;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:14px}
.why h4{font-size:1rem;margin-bottom:3px}
.why p{font-weight:700}
.fbrow{display:flex;gap:10px;margin-top:14px}
.cta{flex:1;min-height:58px;padding:10px 18px;background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:16px;font-family:var(--display);font-weight:700;font-size:1.25rem}
.cta.alt{background:#fff;color:var(--ink)}
.fbrow .spk{align-self:center}

/* Hasil */
.res{padding:24px 18px;text-align:center}
.res .mascot{width:110px;height:110px}
.res .stars{display:flex;justify-content:center;gap:8px;margin-top:4px}
.res .stars .star{width:54px;height:54px}
.res h2{font-size:2rem;margin-top:8px}
.res .big{font-family:var(--display);font-weight:800;font-size:1.2rem;margin-top:6px}
.garden{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:2.2rem;margin-top:12px;line-height:1.1}
.res p{font-weight:800;margin-top:8px}
.btns{display:grid;gap:10px;margin-top:18px}
.btns .cta{flex:none;width:100%}
.rev{margin-top:22px}
.rev h3{font-size:1.25rem;margin-bottom:10px}
.rv{padding:14px;margin-bottom:12px}
.rv .q{font-weight:800}

/* Panduan */
.gd{padding:16px 18px;margin-bottom:14px}
.gd h3{font-size:1.2rem;margin-bottom:6px}
.gd ul{margin:6px 0 0;padding-left:20px;font-weight:700}
.gd li{margin:3px 0}

.song{padding:16px 18px;margin-bottom:16px;border-top:12px solid var(--c)}
.song h3{font-size:1.3rem;margin-bottom:8px}
.lys{display:grid;gap:4px;margin-bottom:12px}
.ly{font-family:var(--kid);font-weight:700;font-size:1.2rem;padding:6px 10px;border-radius:12px;color:var(--muted);transition:background .15s}
.ly.on{background:var(--cs);color:var(--ink)}
.song .cta{flex:none;width:100%}
.tools.wrapt{flex-wrap:wrap}

.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.mascot.ok{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.confetti{position:fixed;left:50%;top:38%;pointer-events:none;z-index:20}
.confetti span{position:absolute;width:10px;height:14px;border-radius:3px;background:var(--c);animation:pop 1s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:420px){
  .hero{grid-template-columns:84px 1fr}
  .hero .mascot{width:84px;height:84px}
  .bubble h1{font-size:1.45rem}
  .world{grid-template-columns:60px 1fr;}
  .world .ic{width:60px;height:60px}
  .world .bs{grid-column:2}
  .cnt button{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/*GEN_START*/
var ONES = ["nol","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan"];
function numWord(n){
  if(n<10) return ONES[n];
  if(n===10) return "sepuluh";
  if(n===11) return "sebelas";
  if(n<20) return ONES[n-10]+" belas";
  var t=Math.floor(n/10), o=n%10;
  return ONES[t]+" puluh"+(o?" "+ONES[o]:"");
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pickOne(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}
  return r;
}
function takeUnique(arr, used, key){
  var pool = arr.filter(function(_,i){return !used[key+i];});
  if(!pool.length){ for(var k in used){ if(k.indexOf(key)===0) delete used[k]; } pool = arr.slice(); }
  var it = pickOne(pool); used[key+arr.indexOf(it)] = 1; return it;
}
function numOpts(c, lo, hi){
  var set=[c], cand=[];
  for(var d=1; d<=4; d++){ if(c-d>=lo) cand.push(c-d); if(c+d<=hi) cand.push(c+d); }
  cand = shuffle(cand);
  while(set.length<4 && cand.length) set.push(cand.pop());
  var guard=0;
  while(set.length<4 && guard++<200){ var r=rand(lo,hi); if(set.indexOf(r)<0) set.push(r); }
  return shuffle(set).map(function(v){return {t:String(v), ok:v===c};});
}
var EMO = ["🍎","🍌","🍓","🍊","🐟","🐥","🌸","⚽","🚗","⭐"];
function grp(e,n,goneFrom){
  var s="";
  for(var i=0;i<n;i++){
    if(goneFrom!=null && i>=goneFrom) s+='<span class="e x" aria-hidden="true">✕</span>';
    else s+='<span class="e" aria-hidden="true">'+e+'</span>';
  }
  return '<span class="grp">'+s+'</span>';
}

/* ---- Berhitung ---- */
function genCount(k){
  var n = k===1 ? rand(2,9) : rand(8,20), e = pickOne(EMO);
  return {type:"pick", prompt:"Sentuh tiap gambar untuk menghitung. Ada berapa semuanya?", say:"Sentuh tiap gambar untuk menghitung. Ada berapa semuanya?",
    tap:{emo:e,n:n}, lay:"num", opts:numOpts(n,1,20),
    expl:"Ada "+n+" gambar. Kita hitung satu per satu sampai "+numWord(n)+"."};
}
function genAdd(k){
  var a,b,c,e=pickOne(EMO),vis,expl;
  if(k===1){
    a=rand(1,8); b=rand(1,10-a); c=a+b;
    vis='<div class="eq">'+grp(e,a)+'<span class="op">+</span>'+grp(e,b)+'</div><div class="eqn">'+a+' + '+b+' = ?</div>';
    expl=a+" ditambah "+b+" sama dengan "+c+". Hitung semua gambarnya, jumlahnya "+c+".";
  } else if(Math.random()<0.5){
    a=rand(5,14); b=rand(2,20-a); c=a+b;
    vis='<div class="eqn">'+a+' + '+b+' = ?</div>';
    expl=a+" + "+b+" = "+c+". Mulai dari "+a+", lalu tambah "+b+" lagi.";
  } else {
    a=rand(10,60); b=rand(3,Math.min(35,99-a)); c=a+b;
    vis='<div class="eqn">'+a+' + '+b+' = ?</div>';
    expl=a+" + "+b+" = "+c+". Tambahkan satuan dulu, lalu puluhan.";
  }
  return {type:"pick", prompt:"Berapa hasilnya?", say:numWord(a)+" tambah "+numWord(b)+" sama dengan berapa?",
    vis:vis, lay:"num", opts:numOpts(c,Math.max(0,c-6),Math.min(99,c+6)), expl:expl};
}
function genSub(k){
  var a,b,c,e=pickOne(EMO),vis,expl;
  if(k===1){
    a=rand(3,10); b=rand(1,a-1); c=a-b;
    vis='<div class="eq">'+grp(e,a,a-b)+'</div><div class="eqn">'+a+' − '+b+' = ?</div><div class="small">Tanda ✕ berarti diambil</div>';
    expl="Ada "+a+" gambar. Yang diambil "+b+" (tanda ✕). Sisanya "+c+".";
  } else if(Math.random()<0.5){
    a=rand(11,20); b=rand(2,a-1); c=a-b;
    vis='<div class="eqn">'+a+' − '+b+' = ?</div>';
    expl=a+" − "+b+" = "+c+". Mulai dari "+a+", lalu kurangi "+b+".";
  } else {
    a=rand(20,99); b=rand(3,Math.min(45,a-1)); c=a-b;
    vis='<div class="eqn">'+a+' − '+b+' = ?</div>';
    expl=a+" − "+b+" = "+c+". Kurangi satuan dulu, lalu puluhan.";
  }
  return {type:"pick", prompt:"Berapa hasilnya?", say:numWord(a)+" kurang "+numWord(b)+" sama dengan berapa?",
    vis:vis, lay:"num", opts:numOpts(c,Math.max(0,c-6),Math.min(99,c+6)), expl:expl};
}
function genCompare(k){
  if(k===1){
    var l=rand(1,9), r=rand(1,9); while(r===l) r=rand(1,9);
    var e=pickOne(EMO), more=Math.random()<0.5;
    var okIsLeft = more ? l>r : l<r;
    return {type:"pick", prompt: more?"Mana yang lebih banyak?":"Mana yang lebih sedikit?", say: more?"Mana yang lebih banyak?":"Mana yang lebih sedikit?",
      lay:"pic", opts:[{t:grp(e,l),ok:okIsLeft},{t:grp(e,r),ok:!okIsLeft}],
      expl:"Kiri ada "+l+", kanan ada "+r+". "+(l>r?l+" lebih banyak dari "+r+".":r+" lebih banyak dari "+l+".")};
  }
  var x=rand(10,99), y=rand(10,99); while(y===x) y=rand(10,99);
  var big=Math.random()<0.5;
  var leftOk = big ? x>y : x<y;
  var tx=Math.floor(x/10), ty=Math.floor(y/10), why;
  if(tx!==ty) why="Lihat puluhannya: "+tx+" puluh dan "+ty+" puluh. "+Math.max(x,y)+" lebih besar dari "+Math.min(x,y)+".";
  else why="Puluhannya sama, jadi lihat satuannya. "+Math.max(x,y)+" lebih besar dari "+Math.min(x,y)+".";
  return {type:"pick", prompt: big?"Mana angka yang lebih besar?":"Mana angka yang lebih kecil?", say: big?"Mana angka yang lebih besar?":"Mana angka yang lebih kecil?",
    lay:"pic", opts:[{t:String(x),ok:leftOk},{t:String(y),ok:!leftOk}], expl:why};
}
function genOrder(k){
  var pool=[], i;
  if(k===1){ for(i=1;i<=10;i++) pool.push(i); } else { for(i=10;i<=99;i++) pool.push(i); }
  var nums = shuffle(pool).slice(0,4), asc = Math.random()<0.5;
  var target = nums.slice().sort(function(a,b){return asc?a-b:b-a;});
  var sh = nums, guard=0;
  while(sh.join()===target.join() && guard++<20) sh = shuffle(nums);
  return {type:"order", prompt: asc?"Sentuh angka dari yang paling kecil sampai yang paling besar.":"Sentuh angka dari yang paling besar sampai yang paling kecil.",
    say: asc?"Sentuh angka dari yang paling kecil sampai yang paling besar.":"Sentuh angka dari yang paling besar sampai yang paling kecil.",
    nums:sh, target:target, expl:"Urutannya: "+target.join(", ")+"."};
}
function genPattern(k){
  if(k===1){
    var pool = shuffle(["🍎","🍌","🍓","🍊","⭐","🌸"]);
    var kind = pickOne(["AB","AAB","ABB","ABC"]), unit;
    if(kind==="AB") unit=[pool[0],pool[1]];
    else if(kind==="AAB") unit=[pool[0],pool[0],pool[1]];

  function render(){
    AU.setSfx(S.efek);
    if(S.screen==="play" && S.musik) AU.startMusic(); else AU.stopMusic();
    app.innerHTML = S.screen==="home"?viewHome() : S.screen==="play"?viewPlay() : S.screen==="result"?viewResult() : S.screen==="songs"?viewSongs() : viewGuide();
    var sig = S.screen+"|"+S.world+"|"+S.i+"|"+S.kelas;
    if(sig!==lastSig){
      lastSig = sig;
      window.scrollTo(0,0);
      if(S.screen==="play" && S.say){ S.say=false; speak(S.items[S.i].say); }
    } else if(S.screen==="play" && S.ctx.state!=="ask"){
      var nb = document.getElementById("nextbtn");
      if(nb){ try{ nb.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){} }
    }
  }

  /* ---------- aksi ---------- */
  function startRound(w){
    S.world=w; S.items=makeRound(w,S.kelas); S.i=0; S.poin=0; S.hist=[]; S.screen="play"; S.say=true;
    newCtx(); lastSig=""; render();
  }
  function finish(g){
    var c=S.ctx;
    c.state = g==="miss" ? "miss" : "ok";
    S.hist.push({g:g, i:S.i});
    S.poin += g==="full"?10 : g==="half"?5 : 0;
    if(g!=="miss") burst();
    AU.sfx(g==="full"?"ok":g==="half"?"half":"miss");
  }
  function wrongTry(){
    var c=S.ctx; c.tries++; c.shake=1;
    if(c.tries>=2) finish("miss"); else AU.sfx("bad");
  }
  function doPick(d){
    var ch=S.items[S.i], c=S.ctx;
    if(c.state!=="ask" || c.wrong.indexOf(d)>=0) return;
    if(ch.opts[d].ok) finish(c.tries===0?"full":"half");
    else { c.wrong.push(d); wrongTry(); }
    render();
  }
  function doTap(i){
    var ch=S.items[S.i], c=S.ctx;
    if(c.state!=="ask" || !ch.tap || c.tapped.indexOf(i)>=0) return;
    c.tapped.push(i); AU.sfx("tap",c.tapped.length); speak(numWord(c.tapped.length));
    render();
  }
  function doSeq(ix){
    var ch=S.items[S.i], c=S.ctx;
    if(c.state!=="ask" || c.seq.indexOf(ix)>=0) return;
    c.seq.push(ix); AU.sfx("sel");
    var need = ch.type==="order" ? ch.target.length : ch.word.length;
    if(c.seq.length===need){
      var got = ch.type==="order" ? c.seq.map(function(k){return ch.nums[k];}).join(",") : c.seq.map(function(k){return ch.tiles[k];}).join("");
      var want = ch.type==="order" ? ch.target.join(",") : ch.word;
      if(got===want) finish(c.tries===0?"full":"half");
      else { c.seq=[]; wrongTry(); }
    }
    render();
  }
  function doSel(ix){
    var c=S.ctx; if(c.state!=="ask" || c.placed[ix]!==undefined) return;
    c.sel = c.sel===ix ? null : ix; AU.sfx("sel"); render();
  }
  function doBin(b){
    var ch=S.items[S.i], c=S.ctx;
    if(c.state!=="ask" || c.sel===null) return;
    var it = ch.items[c.sel];
    if(it.bin===b){
      c.placed[c.sel]=b; c.sel=null; AU.sfx("pop");
      if(Object.keys(c.placed).length===ch.items.length) finish(c.mistakes===0?"full":"half");
    } else { c.mistakes++; c.shake=1; c.sel=null; AU.sfx("bad"); }
    render();
  }
  function next(){
    if(S.ctx.state==="ask") return;
    if(S.i>=S.items.length-1){
      var full=0, half=0; S.hist.forEach(function(h){ if(h.g==="full") full++; else if(h.g==="half") half++; });
      var score=full+half*0.5, n=S.items.length, st = score>=n*0.85?3 : score>=n*0.55?2 : 1;
      var key="k"+S.kelas+"."+S.world;
      if(st>(best[key]||0)){ best[key]=st; saveBest(best); }
      S.screen="result"; lastSig=""; render(); burst(); AU.sfx("fan"); return;
    }
    S.i++; newCtx(); S.say=true; render();
  }

  document.addEventListener("click",function(e){
    var b = e.target.closest("[data-act]"); if(!b) return;
    var a = b.getAttribute("data-act");
    if(a==="start") startRound(b.getAttribute("data-w"));
    else if(a==="kelas"){ S.kelas=parseInt(b.getAttribute("data-k"),10); render(); }
    else if(a==="pick") doPick(parseInt(b.getAttribute("data-d"),10));
    else if(a==="tap") doTap(parseInt(b.getAttribute("data-i"),10));
    else if(a==="seqt") doSeq(parseInt(b.getAttribute("data-ix"),10));
    else if(a==="undo"){ if(S.ctx.state==="ask"){ S.ctx.seq.pop(); render(); } }
    else if(a==="reset"){ if(S.ctx.state==="ask"){ S.ctx.seq=[]; render(); } }
    else if(a==="sel") doSel(parseInt(b.getAttribute("data-ix"),10));
    else if(a==="bin") doBin(parseInt(b.getAttribute("data-b"),10));
    else if(a==="next") next();
    else if(a==="say") speak(b.getAttribute("data-t"), true);
    else if(a==="snd"){ S.suara=!S.suara; if(!S.suara){ try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(x){} } render(); }
    else if(a==="home"){ try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(x){} AU.stopSong(); S.song={id:null,line:-1}; S.screen="home"; lastSig=""; render(); }
    else if(a==="mus"){ S.musik=!S.musik; render(); }
    else if(a==="efk"){ S.efek=!S.efek; AU.setSfx(S.efek); render(); }
    else if(a==="songs"){ S.screen="songs"; lastSig=""; render(); }
    else if(a==="song"){
      var i=parseInt(b.getAttribute("data-i"),10);
      if(S.song.id===i){ AU.stopSong(); S.song={id:null,line:-1}; render(); }
      else {
        S.song={id:i,line:0}; render();
        AU.playSong(SONGS[i], function(li){ S.song.line=li; render(); }, function(){ S.song={id:null,line:-1}; render(); });
      }
    }
    else if(a==="guide"){ S.screen="guide"; lastSig=""; render(); }
  });

  function boot(data){
    if(data && data.screen){ for(var k in data){ if(Object.prototype.hasOwnProperty.call(S,k)) S[k]=data[k]; } }
    S.song={id:null,line:-1};
    render();
  }
  try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot){ window.claude.hot.snapshot(function(){return S;}); } }catch(e){}
  if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); }
  else { boot((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
})();
</script>
