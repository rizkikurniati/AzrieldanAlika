<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulau Pintar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Arah: buku cerita bergambar. Latar langit siang, kartu putih bergaris tinta tebal dengan bayangan datar,
   satu warna per mapel. Tata letak satu kolom, jari-jari besar, mulai dari layar ponsel. */
:root{
  --sky:#d9f1f5; --paper:#ffffff; --ink:#12343b; --muted:#476770; --sun:#ffc533; --line:#b9dde3;
  --mat:#d9402c; --mat-soft:#ffe3de;
  --ipas:#178a54; --ipas-soft:#d8f3e6;
  --bhs:#3b6fd4; --bhs-soft:#dfe8fb;
  --good:#178a54; --good-soft:#d8f3e6; --bad:#b4400a; --bad-soft:#ffe7d6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}

/* Beranda */
.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.brand b{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em}
.brand span{font-size:.9rem;color:var(--muted);font-weight:700}
.hero{overflow:hidden;margin-bottom:26px}
.hero svg{display:block;width:100%;height:auto}
.hero .txt{padding:6px 20px 22px}
.hero h1{font-size:2.5rem;font-weight:800}
.hero p{margin-top:6px;color:var(--muted);font-weight:600;max-width:46ch}
.sec{font-size:1.3rem;margin:0 0 14px}
.mapel-list{display:grid;gap:16px}
.mapel{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;transition:transform .08s,box-shadow .08s}
.mapel:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mapel .ikon{display:grid;place-items:center;width:64px;height:64px;border:2.5px solid var(--ink);border-radius:16px;font-family:var(--display);font-weight:800;font-size:1.25rem;color:#fff}
.mapel.mat .ikon{background:var(--mat)} .mapel.ipas .ikon{background:var(--ipas)} .mapel.bhs .ikon{background:var(--bhs)}
.mapel .ikon sub{font-size:.65em}
.mapel .mt strong{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.1}
.mapel .mt small{display:block;color:var(--muted);font-weight:600;font-size:.92rem;margin-top:3px}
.bs{display:flex;gap:2px}
.star{width:20px;height:20px;fill:#fff;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.star.on{fill:var(--sun)}
.guru-link{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 18px;background:transparent;border:2.5px dashed var(--ink);border-radius:16px;text-align:left;font-weight:700}
.guru-link small{display:block;color:var(--muted);font-weight:600}
.note{margin-top:22px;font-size:.88rem;color:var(--muted);font-weight:600}

/* Kuis */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ghost{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;min-height:44px}
.meta{font-weight:800}
.poin{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.poin .star{width:22px;height:22px}
.dots{display:flex;gap:7px;margin-bottom:16px}
.dots i{flex:1;height:12px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--sun)} .dots i.now{background:var(--line)}
.qcard{padding:20px 18px 22px;border-top:12px solid var(--c)}
.tag{display:inline-block;background:var(--cs);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-weight:800;font-size:.85rem;margin-bottom:12px}
.qcard h2{font-size:1.45rem;font-weight:700;line-height:1.3}
.qcard .fig{margin:14px 0 0;display:flex;justify-content:center}
.qcard .fig svg{width:min(220px,70%);height:auto}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{display:grid;grid-template-columns:40px 1fr 28px;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:16px;font-weight:700;font-size:1.08rem;transition:transform .08s}
.opt:not(:disabled):active{transform:translateY(2px)}
.opt .key{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--ink);border-radius:10px;background:var(--cs);font-family:var(--display);font-weight:800}
.opt .mk{font-weight:800;font-size:1.3rem;text-align:center}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:20px;padding:18px;border:2.5px solid var(--ink);border-radius:20px;background:#fff}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb h3{font-size:1.4rem}
.fb .ans{margin-top:4px;font-weight:700}
.why{margin-top:12px;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:14px}
.why h4{font-size:1rem;margin-bottom:4px}
.why p{font-weight:600}
.cta{margin-top:16px;width:100%;min-height:56px;padding:10px 18px;background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:16px;font-family:var(--display);font-weight:700;font-size:1.2rem}
.cta.alt{background:#fff;color:var(--ink)}

/* Hasil */
.res{padding:26px 20px 24px;text-align:center}
.res .stars{display:flex;justify-content:center;gap:8px}
.res .stars .star{width:56px;height:56px}
.res h2{font-size:2rem;margin-top:12px}
.res .big{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1;margin-top:8px}
.res .big small{font-size:1.1rem;color:var(--muted)}
.res p{margin-top:8px;font-weight:700}
.btns{display:grid;gap:10px;margin-top:18px}
.rev{margin-top:26px}
.rev h3{font-size:1.3rem;margin-bottom:12px}
.rv{padding:16px;margin-bottom:14px}
.rv .q{font-weight:800}
.rv .you{margin-top:8px;font-weight:700;color:var(--bad)}
.rv .rt{font-weight:700;color:var(--good)}

/* Mode guru */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:2.5px solid var(--ink);border-radius:999px;background:#fff;padding:6px 16px;font-weight:800;min-height:44px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.gq{padding:16px;margin-bottom:16px}
.gq .n{font-family:var(--display);font-weight:800;color:var(--muted)}
.gq .q{font-weight:800;margin-top:2px}
.gq ol{list-style:upper-alpha;margin:10px 0 0;padding-left:28px;font-weight:600}
.gq li{padding:2px 0}
.gq li.c{font-weight:800;color:var(--good)}
.gq .why{margin-top:12px}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copyrow .ghost{border-radius:14px}
.stat{font-weight:700;color:var(--muted)}
textarea.copybox{width:100%;min-height:180px;margin-top:12px;padding:12px;border:2.5px solid var(--ink);border-radius:14px;font:inherit;font-size:.9rem}

.song{padding:16px 18px;margin-bottom:16px;border-top:12px solid var(--c)}
.song h3{font-size:1.3rem;margin-bottom:8px}
.lys{display:grid;gap:4px;margin-bottom:12px}
.ly{font-weight:800;font-size:1.05rem;padding:6px 10px;border-radius:12px;color:var(--muted);transition:background .15s}
.ly.on{background:var(--cs);color:var(--ink)}
.song .cta{margin-top:0}
.togs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.togs .ghost{font-size:.95rem}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.92em}
.frac>span{padding:0 .2em}
.frac>span:first-child{border-bottom:2px solid currentColor}

@media (max-width:420px){
  .hero h1{font-size:2.1rem}
  .mapel{grid-template-columns:56px 1fr;}
  .mapel .ikon{width:56px;height:56px}
  .mapel .bs{grid-column:2}
  .qcard h2{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/*BANK_START*/
const MAPEL = {
  mat:{nama:"Matematika", cls:"mat", ikon:"+ ×", sub:"Hitung, pecahan, dan bangun datar"},
  ipas:{nama:"IPAS", cls:"ipas", ikon:"H<sub>2</sub>O", sub:"Alam, hewan, tumbuhan, dan energi"},
  bhs:{nama:"Bahasa Indonesia", cls:"bhs", ikon:"Aa", sub:"Kata, kalimat, dan cerita"}
};

const FIG_KELILING = '<svg viewBox="0 0 160 130" role="img" aria-label="Persegi dengan panjang sisi 6 cm"><rect x="30" y="14" width="90" height="90" rx="4" fill="#ffe3de" stroke="#12343b" stroke-width="3"/><text x="75" y="124" text-anchor="middle" font-size="15" font-weight="800" fill="#12343b">6 cm</text></svg>';
const FIG_LUAS = '<svg viewBox="0 0 210 130" role="img" aria-label="Persegi panjang dengan panjang 8 cm dan lebar 5 cm"><rect x="20" y="14" width="130" height="84" rx="4" fill="#ffe3de" stroke="#12343b" stroke-width="3"/><text x="85" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#12343b">8 cm</text><text x="160" y="60" font-size="15" font-weight="800" fill="#12343b">5 cm</text></svg>';

const BANK = {
mat:[
 {q:"346 + 275 = …", o:["611","621","521","631"], a:1,
  p:"Jumlahkan dari satuan. 6 + 5 = 11, tulis 1 dan simpan 1. Puluhan: 4 + 7 + 1 = 12, tulis 2 dan simpan 1. Ratusan: 3 + 2 + 1 = 6. Hasilnya 621."},
 {q:"504 − 187 = …", o:["317","327","417","337"], a:0,
  p:"Cara mudah: 504 − 200 = 304. Tadi kita mengurangi terlalu banyak 13 (karena 200 − 187 = 13), jadi tambahkan 13. 304 + 13 = 317."},
 {q:"8 × 7 = …", o:["54","56","63","48"], a:1,
  p:"Pecah jadi dua: 8 × 5 = 40 dan 8 × 2 = 16. Lalu 40 + 16 = 56. Hafalkan: lima enam tujuh delapan, 56 = 7 × 8."},
 {q:"72 ÷ 9 = …", o:["7","8","9","6"], a:1,
  p:"Pembagian adalah kebalikan perkalian. Karena 9 × 8 = 72, maka 72 ÷ 9 = 8."},
 {q:"Ibu membeli 3 kantong jeruk. Setiap kantong berisi 12 jeruk. Berapa jumlah jeruk seluruhnya?", o:["15 jeruk","36 jeruk","32 jeruk","38 jeruk"], a:1,
  p:"Ada 3 kelompok yang masing-masing berisi 12, jadi gunakan perkalian: 3 × 12 = 36. Jawaban 15 muncul kalau kita keliru menjumlah 3 + 12."},
 {q:"Pecahan 1/2 nilainya sama dengan pecahan …", o:["1/4","2/4","2/3","3/4"], a:1,
  p:"Kalikan pembilang dan penyebut dengan bilangan yang sama. 1 × 2 = 2 dan 2 × 2 = 4, jadi 1/2 = 2/4. Pizza dibagi 2 lalu ambil 1 potong sama banyaknya dengan pizza dibagi 4 lalu ambil 2 potong."},
 {q:"Pecahan manakah yang paling besar?", o:["1/8","1/4","1/2","1/3"], a:2,
  p:"Semua pembilangnya 1. Makin kecil penyebutnya, makin besar potongannya. Penyebut terkecil adalah 2, jadi 1/2 paling besar. Satu pizza dibagi untuk 2 orang, bagian tiap orang lebih besar daripada dibagi untuk 8 orang."},
 {q:"Sebuah persegi memiliki sisi 6 cm. Berapakah kelilingnya?", fig:FIG_KELILING, o:["12 cm","18 cm","24 cm","36 cm"], a:2,
  p:"Persegi punya 4 sisi yang sama panjang. Keliling = 4 × 6 cm = 24 cm. Jawaban 36 adalah hasil 6 × 6, yaitu luasnya."},
 {q:"Sebuah persegi panjang berukuran panjang 8 cm dan lebar 5 cm. Berapakah luasnya?", fig:FIG_LUAS, o:["13 cm²","26 cm²","40 cm²","45 cm²"], a:2,
  p:"Luas persegi panjang = panjang × lebar = 8 × 5 = 40 cm². Jawaban 26 adalah kelilingnya, yaitu 2 × (8 + 5)."},
 {q:"Berapa menit lamanya 2 jam?", o:["100 menit","120 menit","90 menit","200 menit"], a:1,
  p:"1 jam = 60 menit. Jadi 2 jam = 2 × 60 = 120 menit."},
 {q:"Perhatikan pola bilangan: 5, 10, 15, 20, … Bilangan berikutnya adalah …", o:["24","25","30","35"], a:1,
  p:"Setiap bilangan bertambah 5. Bilangan setelah 20 adalah 20 + 5 = 25."},
 {q:"Dina punya uang Rp5.000. Ia membeli permen Rp1.500 dan kue Rp2.000. Berapa sisa uang Dina?", o:["Rp1.000","Rp1.500","Rp2.000","Rp3.500"], a:1,
  p:"Hitung dulu belanjanya: Rp1.500 + Rp2.000 = Rp3.500. Sisa uang = Rp5.000 − Rp3.500 = Rp1.500. Rp3.500 adalah jumlah yang dibelanjakan, bukan sisanya."}
],
ipas:[
 {q:"Ayam, bebek, dan burung berkembang biak dengan cara bertelur. Hewan yang berkembang biak dengan bertelur disebut …", o:["Ovipar","Vivipar","Herbivora","Karnivora"], a:0,
  p:"Ovipar artinya hewan yang bertelur. Vivipar adalah hewan yang melahirkan, seperti kucing dan sapi. Herbivora dan karnivora menunjukkan jenis makanan, bukan cara berkembang biak."},
 {q:"Bagian tumbuhan yang menyerap air dari dalam tanah adalah …", o:["Akar","Daun","Batang","Bunga"], a:0,
  p:"Akar menyerap air dari tanah. Batang mengangkut air ke seluruh bagian tumbuhan, daun membuat makanan, dan bunga berperan dalam perkembangbiakan."},
 {q:"Tumbuhan hijau membuat makanannya sendiri dengan bantuan cahaya matahari. Proses ini disebut …", o:["Fotosintesis","Penyerbukan","Pernapasan","Penguapan"], a:0,
  p:"Daun mengandung zat hijau daun (klorofil) yang menangkap cahaya matahari. Dengan air dan karbon dioksida, tumbuhan membuat makanan dan melepaskan oksigen. Proses itu bernama fotosintesis."},
 {q:"Benda manakah yang akan ditarik oleh magnet?", o:["Paku besi","Penghapus karet","Sendok kayu","Kertas"], a:0,
  p:"Magnet menarik benda dari besi dan baja. Karet, kayu, dan kertas tidak ditarik oleh magnet."},
 {q:"Es batu yang dibiarkan di bawah sinar matahari berubah menjadi air. Perubahan wujud ini disebut …", o:["Mencair","Membeku","Menguap","Mengembun"], a:0,
  p:"Es (padat) menerima panas lalu berubah menjadi air (cair). Itu namanya mencair. Membeku kebalikannya. Menguap adalah cair menjadi gas, dan mengembun adalah gas menjadi cair."},
 {q:"Siang dan malam silih berganti karena …", o:["Bumi berputar pada porosnya","Matahari berputar mengelilingi Bumi","Bulan menutupi cahaya matahari","Awan menutupi seluruh Bumi"], a:0,
  p:"Bumi berputar pada porosnya, disebut rotasi, satu putaran sekitar 24 jam. Bagian Bumi yang menghadap matahari mengalami siang, bagian yang membelakanginya mengalami malam."},
 {q:"Perhatikan rantai makanan: rumput → belalang → katak → ular. Makhluk hidup yang berperan sebagai produsen adalah …", o:["Rumput","Belalang","Katak","Ular"], a:0,
  p:"Produsen adalah makhluk hidup yang membuat makanannya sendiri, yaitu tumbuhan hijau. Belalang, katak, dan ular disebut konsumen karena memakan makhluk hidup lain."},
 {q:"Manakah yang termasuk sampah organik, yaitu sampah yang mudah membusuk?", o:["Kulit pisang","Botol plastik","Kaleng bekas","Kantong plastik"], a:0,
  p:"Sampah organik berasal dari makhluk hidup dan bisa diurai menjadi kompos, contohnya kulit pisang. Plastik dan kaleng sulit terurai, sebaiknya dikumpulkan untuk didaur ulang."},
 {q:"Untuk mengetahui makanan itu manis atau asin, kita menggunakan indra …", o:["Pengecap (lidah)","Penciuman (hidung)","Pendengaran (telinga)","Peraba (kulit)"], a:0,
  p:"Lidah adalah indra pengecap yang membedakan rasa manis, asin, asam, dan pahit. Hidung untuk mencium bau, telinga untuk mendengar, kulit untuk meraba."},
 {q:"Alat manakah yang mengubah energi listrik terutama menjadi cahaya?", o:["Lampu","Kipas angin","Setrika","Radio"], a:0,
  p:"Lampu mengubah listrik menjadi cahaya. Kipas angin menghasilkan gerak, setrika menghasilkan panas, dan radio menghasilkan bunyi."},
 {q:"Buah mangga yang lepas dari tangkainya jatuh ke tanah karena adanya gaya …", o:["Gravitasi","Magnet","Gesek","Pegas"], a:0,
  p:"Gaya gravitasi Bumi menarik benda ke arah bawah. Karena itu benda yang dilepaskan akan jatuh ke tanah."},
 {q:"Uap air di udara yang dingin berubah menjadi titik-titik air kecil dan membentuk awan. Peristiwa ini disebut …", o:["Mengembun","Menguap","Membeku","Mencair"], a:0,
  p:"Uap air (gas) yang mendingin berubah menjadi titik air (cair). Itu namanya mengembun, bagian dari daur air. Contoh sehari-hari: titik air di bagian luar gelas berisi es."}
],
bhs:[
 {q:"Lawan kata (antonim) dari “rajin” adalah …", o:["malas","giat","tekun","pandai"], a:0,
  p:"Antonim artinya kata yang maknanya berlawanan. Lawan rajin adalah malas. Giat dan tekun maknanya hampir sama dengan rajin."},
 {q:"Persamaan kata (sinonim) dari “pandai” adalah …", o:["cerdas","bodoh","malas","nakal"], a:0,
  p:"Sinonim artinya kata yang maknanya mirip. Pandai bersinonim dengan cerdas. Bodoh adalah lawan katanya."},
 {q:"Kalimat manakah yang penulisan huruf kapitalnya benar?", o:["Ibu pergi ke pasar di Jakarta.","ibu pergi ke pasar di jakarta.","Ibu pergi ke Pasar di jakarta.","ibu Pergi ke pasar di Jakarta."], a:0,
  p:"Huruf kapital dipakai di awal kalimat dan pada nama tempat tertentu seperti Jakarta. Kata “pasar” di sini bukan nama khusus, jadi ditulis dengan huruf kecil."},
 {q:"Tanda baca yang tepat di akhir kalimat “Siapa nama temanmu” adalah …", o:["tanda tanya (?)","tanda seru (!)","tanda titik (.)","tanda koma (,)"], a:0,
  p:"Kalimat itu bertanya, jadi diakhiri tanda tanya: Siapa nama temanmu? Tanda seru dipakai untuk perintah atau seruan, titik untuk kalimat berita."},
 {q:"Kata “main” diberi imbuhan “ber-” menjadi …", o:["bermain","bemain","memain","pemain"], a:0,
  p:"ber- + main = bermain, artinya melakukan permainan. Kata “pemain” memakai imbuhan pe-, artinya orang yang bermain."},
 {q:"Manakah kata yang penulisannya baku?", o:["apotek","apotik","aphotek","apotex"], a:0,
  p:"Menurut Kamus Besar Bahasa Indonesia (KBBI), bentuk bakunya adalah apotek. Kata baku dipakai dalam tulisan resmi, seperti surat dan karangan di sekolah."},
 {q:"Bacalah paragraf ini. “Kucing adalah hewan peliharaan yang disukai banyak orang. Bulunya halus dan lembut. Kucing suka tidur di tempat yang hangat. Ia juga pandai menangkap tikus.” Apa ide pokok paragraf tersebut?", o:["Kucing adalah hewan peliharaan yang disukai banyak orang.","Bulu kucing halus dan lembut.","Kucing suka tidur di tempat hangat.","Kucing pandai menangkap tikus."], a:0,
  p:"Ide pokok adalah gagasan utama paragraf. Kalimat-kalimat lain hanya menjelaskan sifat kucing, jadi gagasan utamanya ada di kalimat pertama."},
 {q:"Manakah yang termasuk kalimat perintah?", o:["Tutuplah pintu itu!","Pintu itu tertutup.","Apakah pintu itu tertutup?","Wah, pintunya besar sekali!"], a:0,
  p:"Kalimat perintah meminta orang lain melakukan sesuatu, seperti “Tutuplah pintu itu!”. Pilihan lain berturut-turut adalah kalimat berita, kalimat tanya, dan kalimat seru."},
 {q:"Satu bait pantun terdiri dari … baris.", o:["2","3","4","6"], a:2,
  p:"Pantun biasanya terdiri dari 4 baris dalam satu bait. Dua baris pertama adalah sampiran, dua baris terakhir adalah isi. Bunyi akhir barisnya bersajak a-b-a-b."},
 {q:"Cerita yang tokohnya hewan dan berperilaku seperti manusia disebut …", o:["legenda","pantun","fabel","biografi"], a:2,
  p:"Fabel adalah cerita dengan tokoh hewan yang bisa berbicara dan bertingkah seperti manusia, biasanya berisi pesan moral. Contohnya cerita Kancil dan Buaya."},
 {q:"Untuk menanyakan alasan, kata tanya yang tepat adalah …", o:["mengapa","siapa","kapan","di mana"], a:0,

    AU.setSfx(S.efek);
    if(S.screen==="quiz" && S.musik) AU.startMusic(); else AU.stopMusic();
    var html = S.screen==="home"?viewHome() : S.screen==="quiz"?viewQuiz() : S.screen==="result"?viewResult() : S.screen==="songs"?viewSongs() : viewGuru();
    app.innerHTML = html;
    var sig = S.screen+"|"+S.m+"|"+S.i+"|"+S.gm;
    if(sig!==lastSig){
      lastSig = sig;
      window.scrollTo(0,0);
      if(S.screen==="quiz"){var q=document.getElementById("q"); if(q) q.focus({preventScroll:true});}
    } else if(S.screen==="quiz" && S.chosen!==null){
      var nb = document.getElementById("nextbtn");
      if(nb){ nb.focus({preventScroll:true}); nb.scrollIntoView({block:"nearest",behavior:"smooth"}); }
    }
  }

  /* ---------- aksi ---------- */
  function start(m){
    var ids = shuffle(BANK[m].map(function(_,i){return i;})).slice(0,PER_RONDE);
    S.screen="quiz"; S.m=m; S.ids=ids;
    S.maps = ids.map(function(){return shuffle([0,1,2,3]);});
    S.i=0; S.chosen=null; S.poin=0; S.benar=0; S.hist=[];
    lastSig=""; render();
  }
  function pick(d){
    if(S.screen!=="quiz"||S.chosen!==null) return;
    var item = BANK[S.m][S.ids[S.i]], order = S.maps[S.i];
    var ok = order[d]===item.a;
    S.chosen = d;
    S.hist.push({id:S.ids[S.i], pick:order[d], ok:ok});
    if(ok){S.poin+=10; S.benar+=1; AU.sfx("ok");} else AU.sfx("bad");
    render();
  }
  function next(){
    if(S.chosen===null) return;
    if(S.i>=PER_RONDE-1){
      var n = bintang(S.benar);
      if(n>(best[S.m]||0)){best[S.m]=n; saveBest(best);}
      S.screen="result"; lastSig=""; render(); AU.sfx("fan"); return;
    }
    S.i+=1; S.chosen=null; render();
  }
  function copyGuru(){
    var text = guruText(S.gm);
    S.copyText = null; S.copyMsg = "";
    var done = function(ok){
      if(ok){S.copyMsg="Tersalin. Tempel ke dokumen Anda.";}
      else {S.copyText=text; S.copyMsg="Salin manual dari kotak di bawah.";}
      render();
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(false);});
      } else done(false);
    }catch(e){done(false);}
  }

  document.addEventListener("click",function(e){
    var b = e.target.closest("[data-act]"); if(!b) return;
    var act = b.getAttribute("data-act");
    if(act==="start") start(b.getAttribute("data-m"));
    else if(act==="pick") pick(parseInt(b.getAttribute("data-d"),10));
    else if(act==="next") next();
    else if(act==="home"){AU.stopSong(); S.song={id:null,line:-1}; S.screen="home"; S.m=null; lastSig=""; render();}
    else if(act==="mus"){S.musik=!S.musik; render();}
    else if(act==="efk"){S.efek=!S.efek; AU.setSfx(S.efek); render();}
    else if(act==="songs"){S.screen="songs"; lastSig=""; render();}
    else if(act==="song"){
      var si=parseInt(b.getAttribute("data-i"),10);
      if(S.song.id===si){ AU.stopSong(); S.song={id:null,line:-1}; render(); }
      else {
        S.song={id:si,line:0}; render();
        AU.playSong(SONGS[si], function(li){ S.song.line=li; render(); }, function(){ S.song={id:null,line:-1}; render(); });
      }
    }
    else if(act==="guru"){S.screen="guru"; S.copyText=null; S.copyMsg=""; lastSig=""; render();}
    else if(act==="gtab"){S.gm=b.getAttribute("data-m"); S.copyText=null; S.copyMsg=""; render();}
    else if(act==="copy") copyGuru();
  });
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(S.screen!=="quiz"||S.chosen!==null) return;
    var map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
    var k = String(e.key).toLowerCase();
    if(Object.prototype.hasOwnProperty.call(map,k)){e.preventDefault(); pick(map[k]);}
  });

  /* simpan posisi saat halaman diperbarui */
  function boot(data){
    if(data && data.screen){ for(var k in data){ if(Object.prototype.hasOwnProperty.call(S,k)) S[k]=data[k]; } }
    S.song={id:null,line:-1};
    render();
  }
  try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot){ window.claude.hot.snapshot(function(){return S;}); } }catch(e){}
  if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); }
  else { boot((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
})();
</script>
</body>
</html>
